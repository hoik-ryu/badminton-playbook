# Compose project name defaults to the directory name (override with COMPOSE_PROJECT_NAME in .env),
# so projects created from this template do not share containers or the DB volume.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      # Loopback only: the DB uses dev credentials and must not be reachable from the LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_NAME: ${APP_NAME:-badminton-playbook}
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # 카카오 키·SESSION_SECRET·DEV_LOGIN_* 는 마운트된 backend/.env(/app/.env)에서 읽습니다(여기에 값을 쓰지 않음).
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      # 비우면 같은 출처(/api → Vite 프록시 → backend). 세션 쿠키·카카오 Redirect URI가 이 방식을 전제로 함
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_DATA_SOURCE: ${VITE_DATA_SOURCE:-mock}
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db-data:
